name: Wrong language detection
description: A video in the language you learn was not counted, or a video in another language was.
labels: ["detection"]
body:
  - type: input
    id: video
    attributes:
      label: Link to the video
      description: A public YouTube link, so the video can be checked.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: The language you learn
      description: The language set in the settings of the Deuchan dashboard, for example Japanese.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - A video in the language I learn was not counted
        - A video in another language was counted
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: The language of the audio, whether it has captions (automatic or uploaded) and in which languages.
