<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deuchan dashboard</title>
    <link rel="stylesheet" href="../src/theme.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Deuchan</h1>
          <p class="tagline">German immersion time tracker</p>
        </div>
        <button class="icon-button" id="theme" type="button"></button>
      </header>

      <section class="cards" aria-label="Totals">
        <div class="stat">
          <p class="stat-value" id="today">0:00</p>
          <p class="stat-label">Today</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="week">0:00</p>
          <p class="stat-label">Last 7 days</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="month">0:00</p>
          <p class="stat-label">Last 30 days</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="total">0:00</p>
          <p class="stat-label">All time</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="dailyAverage">0:00</p>
          <p class="stat-label">Daily average</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="monthlyAverage">0:00</p>
          <p class="stat-label">Monthly average</p>
        </div>
      </section>

      <section class="panel">
        <h2>Activity</h2>
        <div class="heatmap-scroll">
          <div class="heatmap" id="heatmap"></div>
        </div>
        <div class="legend">
          Less
          <span class="cell level-0"></span><span class="cell level-1"></span
          ><span class="cell level-2"></span><span class="cell level-3"></span
          ><span class="cell level-4"></span><span class="cell level-5"></span>
          More
        </div>
      </section>

      <div class="two">
        <section class="panel">
          <h2>Last 7 days</h2>
          <div class="week" id="weekBars"></div>
        </section>
        <section class="panel">
          <h2>Monthly overview</h2>
          <div class="months" id="months"></div>
        </section>
      </div>
    </main>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
