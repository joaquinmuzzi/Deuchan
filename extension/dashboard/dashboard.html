<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deuchan dashboard</title>
    <link rel="stylesheet" href="../src/theme.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Deuchan</h1>
        <div class="icons">
          <button class="icon-button" id="settings" type="button" aria-label="Daily goal settings">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M10.3 4.3a1.7 1.7 0 0 1 3.4 0 1.7 1.7 0 0 0 2.5 1.1 1.7 1.7 0 0 1 2.4 2.4 1.7 1.7 0 0 0 1.1 2.5 1.7 1.7 0 0 1 0 3.4 1.7 1.7 0 0 0-1.1 2.5 1.7 1.7 0 0 1-2.4 2.4 1.7 1.7 0 0 0-2.5 1.1 1.7 1.7 0 0 1-3.4 0 1.7 1.7 0 0 0-2.5-1.1 1.7 1.7 0 0 1-2.4-2.4 1.7 1.7 0 0 0-1.1-2.5 1.7 1.7 0 0 1 0-3.4 1.7 1.7 0 0 0 1.1-2.5 1.7 1.7 0 0 1 2.4-2.4 1.7 1.7 0 0 0 2.5-1.1Z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button class="icon-button" id="theme" type="button"></button>
        </div>
      </header>

      <section class="cards" aria-label="Totals">
        <div class="stat">
          <p class="stat-value" id="today">0:00</p>
          <p class="stat-label">Today</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="week">0:00</p>
          <p class="stat-label">7 days</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="month">0:00</p>
          <p class="stat-label">30 days</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="total">0:00</p>
          <p class="stat-label">All time</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="dailyAverage">0:00</p>
          <p class="stat-label">Daily average</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="monthlyAverage">0:00</p>
          <p class="stat-label">Monthly average</p>
        </div>
      </section>

      <div class="row">
        <section class="panel">
          <h2>Activity</h2>
          <div class="body"><div class="heatmap" id="heatmap"></div></div>
        </section>

        <section class="panel">
          <h2>Time per day</h2>
          <div class="body">
            <div class="ranges" id="ranges" role="radiogroup" aria-label="Range"></div>
            <div class="chart" id="chart"></div>
            <div class="axis"><span id="axisStart"></span><span>Today</span></div>
          </div>
        </section>

        <section class="panel">
          <h2>By weekday</h2>
          <div class="body"><div class="weekdays" id="weekdays"></div></div>
        </section>
      </div>
    </main>

    <dialog id="goalDialog" aria-labelledby="goalTitle">
      <form id="goalForm" method="dialog" novalidate>
        <h2 id="goalTitle">Daily goal</h2>
        <div class="dialog-body">
          <label for="goalInput">Minutes per day</label>
          <input id="goalInput" type="text" inputmode="numeric" autocomplete="off" />
          <p class="error" id="goalError" role="alert"></p>
          <div class="actions">
            <button class="button" id="goalCancel" type="button">Cancel</button>
            <button class="button primary" type="submit">Save</button>
          </div>
        </div>
      </form>
    </dialog>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
