<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deuchan</title>
    <link rel="stylesheet" href="../src/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Deuchan</h1>
        <p class="tagline">German immersion time tracker</p>
      </div>
      <button class="icon-button" id="theme" type="button"></button>
    </header>

    <button class="primary" id="dashboard" type="button">Open dashboard</button>

    <p class="status" id="status" data-kind="idle">Not on YouTube</p>

    <section class="stats">
      <div class="stat">
        <p class="stat-value" id="today">0:00</p>
        <p class="stat-label">Today</p>
      </div>
      <div class="stat">
        <p class="stat-value" id="week">0:00</p>
        <p class="stat-label">7 days</p>
      </div>
      <div class="stat">
        <p class="stat-value" id="month">0:00</p>
        <p class="stat-label">30 days</p>
      </div>
    </section>

    <p class="streak"><span id="streak">0</span> day streak</p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
