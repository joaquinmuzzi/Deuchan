<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deuchan</title>
    <link rel="stylesheet" href="../src/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Deuchan</h1>
      <div class="actions">
        <button class="link" id="dashboard" type="button">Dashboard</button>
        <button class="icon-button" id="theme" type="button"></button>
      </div>
    </header>

    <div class="live" id="status" data-kind="idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">Not on YouTube</span>
      <button class="quiet" id="override" type="button" hidden></button>
    </div>

    <section class="goal" id="goalBlock" data-met="false">
      <div class="goal-top">
        <p class="goal-value" id="today">0:00</p>
        <p class="goal-label" id="goalText">30:00 left of 30:00</p>
      </div>
      <div class="bar" role="progressbar" aria-label="Daily goal" aria-valuemin="0" aria-valuemax="100">
        <div class="fill" id="progress"></div>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <p class="stat-value" id="streak">0 days</p>
        <p class="stat-label">Streak</p>
      </div>
      <div class="stat">
        <p class="stat-value" id="dailyAverage">0:00</p>
        <p class="stat-label">Daily avg</p>
      </div>
      <div class="stat">
        <p class="stat-value" id="week">0:00</p>
        <p class="stat-label">7 days</p>
      </div>
    </section>

    <footer class="footer">
      <a href="https://github.com/joaquinmuzzi" target="_blank" rel="noopener noreferrer"
        >Created by Frodouwu</a
      >
      <a href="https://github.com/joaquinmuzzi/deuchan" target="_blank" rel="noopener noreferrer"
        >Star on GitHub</a
      >
      <a href="https://ko-fi.com/muzzijoaquin" target="_blank" rel="noopener noreferrer">Ko-fi</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
