<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deuchan</title>
    <link rel="stylesheet" href="../src/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Deuchan</h1>
      <button class="icon-button" id="theme" type="button"></button>
    </header>

    <button class="button primary" id="dashboard" type="button">Open dashboard</button>

    <section class="status" id="status" data-kind="idle">
      <p class="status-text" id="statusText">Not on YouTube</p>
      <p class="status-hint" id="statusHint" hidden></p>
      <button class="button" id="override" type="button" hidden></button>
    </section>

    <section class="goal">
      <p class="goal-value" id="today">0:00</p>
      <p class="goal-label">of <span id="goal">30:00</span> daily goal</p>
    </section>

    <section class="stats">
      <div class="stat">
        <p class="stat-value" id="week">0:00</p>
        <p class="stat-label">7 days</p>
      </div>
      <div class="stat">
        <p class="stat-value" id="month">0:00</p>
        <p class="stat-label">30 days</p>
      </div>
      <div class="stat">
        <p class="stat-value" id="streak">0</p>
        <p class="stat-label">Streak</p>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
